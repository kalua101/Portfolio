<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#84cc16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#grad)"/>
  
  <!-- Head -->
  <circle cx="200" cy="160" r="70" fill="#1f2937"/>
  
  <!-- Body -->
  <ellipse cx="200" cy="320" rx="120" ry="100" fill="#1f2937"/>
  
  <!-- Initials -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">KT</text>
</svg>
